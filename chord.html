<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>关系星图（草稿） · 几何图谱</title>
<meta name="description" content="四十多条有名定理排成一圈，定理之间的推广与对偶关系画成跨越圆心的弧线。">
<style>
:root{
  --bg:#f7f8f9; --ink:#16181a; --dim:#4a5056; --faint:#8b949c; --line:#e3e6e9;
  --accent:#bc4c00; --ink0:#0f1115;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181a; --ink:#e8eaec; --dim:#aeb4ba; --faint:#767d84; --line:#2b2f33; --accent:#ff8a4c;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:30px 16px 60px}
a{color:var(--accent)}
.back{font-size:13px;text-decoration:none}
h1{font-size:23px;margin:12px 0 6px;letter-spacing:.5px}
.lede{color:var(--dim);margin:0 0 4px;max-width:44em}
.note{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:0 0 14px}

.stage{position:relative;background:var(--ink0);border-radius:14px;padding:6px;overflow:hidden}
svg{display:block;width:100%;height:auto}

/* 外圈家族弧 */
.rim{fill:none;stroke-width:5;stroke-linecap:butt;opacity:.9}
.famlab{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.4px;fill:#aeb6bf}

/* 定理点与标签 */
.node{fill:#cfd6dd;transition:fill .18s,r .18s}
.node.linked{fill:#f2f4f6}
.lab{font-size:8.2px;fill:#79828c;transition:fill .18s,font-weight .18s}
.hitbox{fill:transparent;cursor:pointer}

/* 关系弧 */
.chord{fill:none;stroke-width:1.1;opacity:.5;transition:opacity .2s,stroke-width .2s}
.chord.dual{stroke-dasharray:4 3}

/* 悬停：相关的亮起来，其余压暗 */
svg.focusing .chord{opacity:.07}
svg.focusing .chord.on{opacity:1;stroke-width:2.1}
svg.focusing .lab{fill:#4e565e}
svg.focusing .lab.on{fill:#fff;font-weight:700}
svg.focusing .node{fill:#3a4149}
svg.focusing .node.on{fill:#fff}

/* 出场：外圈先扫出来，弦再一条条画 */
.rim,.chord{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);
  transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1),opacity .2s,stroke-width .2s}
svg.go .rim{stroke-dashoffset:0;transition-delay:calc(var(--i) * 60ms)}
svg.go .chord{stroke-dashoffset:0;transition-delay:calc(700ms + var(--i) * 55ms)}
.node,.lab,.famlab{opacity:0;transition:opacity .4s ease}
svg.go .node,svg.go .lab{opacity:1;transition-delay:calc(560ms + var(--i) * 12ms)}
svg.go .famlab{opacity:1;transition-delay:calc(var(--i) * 60ms + 400ms)}

.ctr-n{font-size:40px;font-weight:700;fill:#f2f4f6;letter-spacing:1px;
  font-family:var(--sans);opacity:0;transition:opacity .4s ease .9s}
.ctr-s{font-size:11px;fill:#79828c;letter-spacing:3px;font-family:var(--mono);
  opacity:0;transition:opacity .4s ease .9s}
svg.go .ctr-n,svg.go .ctr-s{opacity:1}
svg.focusing .ctr-n{font-size:17px;font-weight:600}
#tip{min-height:3.4em;margin:14px 2px 0;font-size:13.5px;color:var(--dim)}
#tip b{color:var(--ink)}
#tip .k{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;
  font-family:var(--mono);font-size:11px;color:var(--faint)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
@media (prefers-reduced-motion:reduce){
  .rim,.chord{stroke-dashoffset:0 !important;transition:none}
  .node,.lab,.famlab{opacity:1 !important}
}
@media (max-width:560px){ .wrap{padding:22px 12px 48px} h1{font-size:20px} .lab{font-size:9.5px} }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回几何图谱</a>
  <h1>关系星图</h1>
  <p class="lede">四十多条有名定理沿着一圈排开，按家族分段上色；定理之间的推广与对偶关系，
     画成跨过圆心的弧。把鼠标放到任意一条上，它牵着的线就会亮起来。</p>
  <p class="note" id="note"></p>

  <div class="stage">
    <svg id="sky" viewBox="0 0 760 760" aria-label="定理关系星图"></svg>
  </div>

  <div id="tip">把鼠标放到圈上的任意一条定理。</div>
  <div class="legend">
    <span><i style="background:#f2f4f6"></i>推广 generalizes</span>
    <span><i style="background:#f2f4f6;background-image:repeating-linear-gradient(90deg,#f2f4f6 0 4px,transparent 4px 7px)"></i>对偶 dual</span>
  </div>
</div>

<script src="data/atlas.js"></script>
<script>
(function () {
  var A = window.ATLAS, svg = document.getElementById('sky'), tip = document.getElementById('tip');
  var CX = 380, CY = 380, R = 272;

  var HUE = {
    'nine-point': '#ff8a4c', 'gems': '#ffc857', 'projective': '#7b9cff',
    'circle': '#56c7a6', 'concurrent': '#c89bff', 'metric': '#8d99a6',
    'inequality': '#ff7a9c', 'solid': '#5fd0e8'
  };

  // 家族顺序：好看的放在最上面（从正上方顺时针）
  var ORDER = ['nine-point', 'gems', 'projective', 'circle', 'concurrent', 'metric', 'inequality', 'solid'];
  var fams = ORDER.map(function (id) {
    return A.families.filter(function (f) { return f.id === id; })[0];
  }).filter(Boolean);

  var items = [];                       // 按家族摊平
  fams.forEach(function (f) {
    A.theorems.filter(function (t) { return t.family === f.id; })
      .forEach(function (t) { items.push({ t: t, fam: f }); });
  });

  var GAP = 0.055;                      // 家族之间留空
  var nFam = fams.length, N = items.length;
  var span = (2 * Math.PI - nFam * GAP) / N;
  var ang = {}, k = 0, lastFam = null, famRange = {};
  items.forEach(function (it, i) {
    if (it.fam.id !== lastFam) { if (lastFam !== null) k += GAP; lastFam = it.fam.id;
      famRange[it.fam.id] = { a0: -Math.PI / 2 + k }; }
    ang[it.t.id] = -Math.PI / 2 + k + span / 2;
    k += span;
    famRange[it.fam.id].a1 = -Math.PI / 2 + k;
  });

  var P = function (a, r) { return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) }; };
  var f2 = function (n) { return Math.round(n * 10) / 10; };

  var deg = {};
  A.relations.forEach(function (r) { deg[r.from] = (deg[r.from] || 0) + 1; deg[r.to] = (deg[r.to] || 0) + 1; });

  var parts = [], idx = 0;

  // 外圈家族弧
  fams.forEach(function (f, i) {
    var r0 = famRange[f.id]; if (!r0) return;
    var p0 = P(r0.a0, R + 16), p1 = P(r0.a1, R + 16);
    var large = (r0.a1 - r0.a0) > Math.PI ? 1 : 0;
    parts.push('<path class="rim" style="--i:' + i + '" stroke="' + HUE[f.id] + '" d="M' +
      f2(p0.x) + ' ' + f2(p0.y) + 'A' + (R + 16) + ' ' + (R + 16) + ' 0 ' + large + ' 1 ' +
      f2(p1.x) + ' ' + f2(p1.y) + '"/>');
    var am = (r0.a0 + r0.a1) / 2, lp = P(am, R + 34);
    var rot = am * 180 / Math.PI + (Math.cos(am) < 0 ? 180 : 0);
    parts.push('<text class="famlab" style="--i:' + i + '" x="' + f2(lp.x) + '" y="' + f2(lp.y) +
      '" text-anchor="middle" dominant-baseline="middle" transform="rotate(' + f2(rot) + ' ' +
      f2(lp.x) + ' ' + f2(lp.y) + ')">' + f.name + '</text>');
  });

  // 关系弧：越靠近的两点，控制点离圆心越远，弧度更自然
  A.relations.forEach(function (r, i) {
    var a1 = ang[r.from], a2 = ang[r.to];
    if (a1 == null || a2 == null) return;
    var p1 = P(a1, R), p2 = P(a2, R);
    var d = Math.abs(a1 - a2); if (d > Math.PI) d = 2 * Math.PI - d;
    // 经典弦图：所有弧都往圆心兜，近邻也兜一个大弯，整张图才有「跨越」的样子
    var am = (a1 + a2) / 2 + (Math.abs(a1 - a2) > Math.PI ? Math.PI : 0);
    var cm = P(am, R * 0.10 * (1 - d / Math.PI));
    var col = HUE[(A.theorems.filter(function (t) { return t.id === r.from; })[0] || {}).family] || '#f2f4f6';
    parts.push('<path class="chord ' + r.type + '" style="--i:' + i + '" stroke="' + col +
      '" data-a="' + r.from + '" data-b="' + r.to + '" d="M' + f2(p1.x) + ' ' + f2(p1.y) +
      'Q' + f2(cm.x) + ' ' + f2(cm.y) + ' ' + f2(p2.x) + ' ' + f2(p2.y) + '"/>');
  });

  // 定理点与标签
  items.forEach(function (it, i) {
    var a = ang[it.t.id], p = P(a, R), lp = P(a, R + 8);
    var right = Math.cos(a) >= 0;
    var rot = a * 180 / Math.PI + (right ? 0 : 180);
    parts.push('<circle class="node' + (deg[it.t.id] ? ' linked' : '') + '" style="--i:' + i +
      '" cx="' + f2(p.x) + '" cy="' + f2(p.y) + '" r="' + (deg[it.t.id] ? 3.4 : 2.2) + '" data-id="' + it.t.id + '"/>');
    parts.push('<text class="lab" style="--i:' + i + '" x="' + f2(lp.x) + '" y="' + f2(lp.y) +
      '" text-anchor="' + (right ? 'start' : 'end') + '" dominant-baseline="middle" transform="rotate(' +
      f2(rot) + ' ' + f2(lp.x) + ' ' + f2(lp.y) + ')" data-id="' + it.t.id + '">' + it.t.name + '</text>');
    // 透明的大热区，手机上也点得到
    var hp = P(a, R + 2);
    parts.push('<circle class="hitbox" cx="' + f2(hp.x) + '" cy="' + f2(hp.y) + '" r="10" data-id="' + it.t.id + '"/>');
  });

  parts.push('<text id="c1" x="' + CX + '" y="' + (CY - 6) + '" text-anchor="middle" ' +
    'dominant-baseline="middle" class="ctr-n">' + N + '</text>');
  parts.push('<text id="c2" x="' + CX + '" y="' + (CY + 20) + '" text-anchor="middle" ' +
    'dominant-baseline="middle" class="ctr-s">条定理</text>');
  svg.innerHTML = parts.join('');

  // 每条线的长度，用来做「自己画出来」
  svg.querySelectorAll('.rim, .chord').forEach(function (el) {
    var L = 0; try { L = el.getTotalLength(); } catch (e) {}
    if (L) el.style.setProperty('--L', L);
  });
  requestAnimationFrame(function () { requestAnimationFrame(function () { svg.classList.add('go'); }); });

  var byId = {}; A.theorems.forEach(function (t) { byId[t.id] = t; });
  var nRel = A.relations.length, nLinked = Object.keys(deg).length;
  document.getElementById('note').textContent =
    N + ' 条定理 · ' + fams.length + ' 个家族 · ' + nRel + ' 条关系 · 其中 ' + nLinked + ' 条定理有连线';

  function focus(id) {
    if (!id) {
      svg.classList.remove('focusing');
      var a1 = svg.querySelector('#c1'), a2 = svg.querySelector('#c2');
      if (a1) a1.textContent = N;
      if (a2) a2.textContent = '条定理';
      return;
    }
    svg.classList.add('focusing');
    var names = [];
    svg.querySelectorAll('.chord').forEach(function (c) {
      var on = c.dataset.a === id || c.dataset.b === id;
      c.classList.toggle('on', on);
      if (on) names.push(c.dataset.a === id ? c.dataset.b : c.dataset.a);
    });
    svg.querySelectorAll('.node, .lab').forEach(function (e) {
      e.classList.toggle('on', e.dataset.id === id || names.indexOf(e.dataset.id) >= 0);
    });
    var t = byId[id];
    var c1 = svg.querySelector('#c1'), c2 = svg.querySelector('#c2');
    if (c1) c1.textContent = t.name;
    if (c2) c2.textContent = (names.length ? names.length + ' 条关系' : '暂无关系');
    tip.innerHTML = '<span class="k">' + t.id + '</span><b>' + t.name + '</b>　' + t.statement +
      (names.length ? '<br><span class="k">连着</span>' +
        names.map(function (n) { return byId[n] ? byId[n].name : n; }).join('、') : '');
  }

  svg.addEventListener('mouseover', function (e) {
    var h = e.target.closest('.hitbox, .node, .lab');
    if (h && h.dataset.id) focus(h.dataset.id);
  });
  svg.addEventListener('mouseleave', function () {
    focus(null);
    tip.textContent = '把鼠标放到圈上的任意一条定理。';
  });
  svg.addEventListener('click', function (e) {
    var h = e.target.closest('.hitbox, .node, .lab');
    if (h && h.dataset.id) focus(h.dataset.id);
  });
})();
</script>
</body>
</html>
