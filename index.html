<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>几何图谱 · 有名定理的家族与关系</title>
<meta name="description" content="四十多条有名的平面几何定理，按家族排成一张图谱，标出它们之间的推广、特例与对偶关系；十来条可以拖动顶点看动态图。">
<style>
:root{
  --bg:#f7f8f9; --card:#fff; --ink:#16181a; --dim:#4a5056; --faint:#8b949c;
  --line:#e3e6e9; --accent:#bc4c00; --accent-soft:#fdf0e8;
  --ink0:#0f1115;
  --s-tri:#e8eaec; --s-aux:#5a6470; --s-hi:#ff8a4c; --s-alt:#7b9cff; --s-pt:#f2f4f6;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181b; --card:#1d2125; --ink:#e8eaec; --dim:#aeb4ba; --faint:#767d84;
  --line:#2b3035; --accent:#ff8a4c; --accent-soft:#2a1d15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --card:#1d2125; --ink:#e8eaec; --dim:#aeb4ba; --faint:#767d84;
  --line:#2b3035; --accent:#ff8a4c; --accent-soft:#2a1d15; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:1560px;margin:0 auto;padding:32px 24px 70px}

header{margin-bottom:22px}
h1{font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:.5px}
h1::after{content:"";display:block;height:2px;width:72px;margin-top:10px;
  background:var(--accent);transform-origin:left;animation:wipe .6s cubic-bezier(.2,.7,.2,1) .4s both}
.lede{color:var(--dim);margin:0 0 14px;max-width:46em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.3px;color:var(--dim);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;
  transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .lbl{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:2px}

.cols{display:grid;grid-template-columns:minmax(420px,46%) 1fr;gap:34px;align-items:start}
.left{position:sticky;top:20px}
#sun{display:block;width:100%;height:auto}
.arc{cursor:pointer;transition:fill-opacity .18s,stroke .18s}
.arc.dimmed{fill-opacity:.12 !important;cursor:default}
.arc.active{stroke:var(--ink);stroke-width:1.6}
.sunhint{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;margin-top:4px}

.fam{scroll-margin-top:18px;margin-bottom:30px}
.fam h2{font-size:17px;margin:0 0 3px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.fam h2 .sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.fam h2 .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.fam p.intro{color:var(--faint);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--fc,var(--line));
  border-radius:10px;padding:12px 14px;cursor:pointer;scroll-margin-top:20px;
  transition:border-color .15s,transform .15s,box-shadow .15s,opacity .2s}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,22,30,.07)}
.card.faded{opacity:.25}
.card.flash{box-shadow:0 0 0 2px var(--accent)}
.card .fig{margin:-12px -14px 10px;border-radius:7px 7px 0 0;overflow:hidden;
  background:var(--ink0);position:relative;cursor:pointer}
/* 常驻的放大角标：不悬停也看得见，告诉人这张图点得开 */
.card .fig::after{content:"⤢";position:absolute;top:6px;right:7px;width:20px;height:20px;
  display:grid;place-items:center;font-size:12px;line-height:1;color:#dfe5ea;
  background:rgba(0,0,0,.45);border-radius:6px;opacity:.65;transition:opacity .15s}
/* 悬停时底部浮出一行，说清楚点开能得到什么 */
.card .fig::before{content:"点开放大 · 可拖动顶点";position:absolute;left:0;right:0;bottom:0;
  padding:16px 10px 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.3px;
  color:#eef1f4;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.72));
  opacity:0;transition:opacity .18s;pointer-events:none;z-index:1}
.card .fig:hover::before{opacity:1}
.card .fig:hover::after{opacity:0}
.card .id{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.5px}
.card .nm{font-weight:600;font-size:15px;margin:1px 0 4px}
.card .one{color:var(--dim);font-size:13px;line-height:1.55}
.card .flag{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10.5px;
  color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px}
/* 展开要「长高」，不是「闪现」。高度由 JS 量出来再过渡 —— 纯 CSS 的 max-height
   方案要么猜一个上限，要么和层叠打架，直接量最可靠。 */
.card .more{height:0;overflow:hidden;opacity:0;margin-top:0;padding-top:0;
  border-top:1px dashed transparent;
  transition:height .32s cubic-bezier(.2,.7,.2,1),opacity .22s ease,
             margin-top .32s cubic-bezier(.2,.7,.2,1),padding-top .32s cubic-bezier(.2,.7,.2,1),
             border-top-color .2s ease}
.card.open .more{opacity:1;margin-top:11px;padding-top:11px;border-top-color:var(--line)}
.more dt{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.5px;margin-top:9px}
.more dt:first-child{margin-top:0}
.more dd{margin:2px 0 0;font-size:13px;color:var(--dim);line-height:1.6}
.more dd.deps{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.dep{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;
  padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.dep.th{color:var(--ink);cursor:pointer;font-family:inherit}
.dep.th:hover{border-color:var(--fc);color:var(--fc)}
.dep.th i{font-family:var(--mono);font-size:9.5px;font-style:normal;color:var(--faint);letter-spacing:.3px}
.dep.tool{color:var(--faint);border-style:dashed}
.more .rel b{color:var(--ink);font-weight:600}

svg.thumb{display:block;width:100%;height:auto;background:var(--ink0);--k:1}
svg.thumb *{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tri{stroke:var(--s-tri);stroke-width:calc(1.5 / var(--k,1))}
.tri.dim{stroke:var(--s-aux);stroke-width:calc(1 / var(--k,1))}
.tri.hi2{stroke:var(--s-hi);stroke-width:calc(1.2 / var(--k,1));stroke-dasharray:3 3}
.aux{stroke:var(--s-aux);stroke-width:calc(1.25 / var(--k,1))}
.thin{stroke:#8d99a6;stroke-width:calc(1.2 / var(--k,1));stroke-dasharray:3.5 3}
.alt{stroke:var(--s-alt);stroke-width:calc(1.4 / var(--k,1))}
.hi{stroke:var(--s-hi);stroke-width:calc(1.8 / var(--k,1))}
.pt{fill:var(--s-pt);stroke:none;r:calc(2.6 / var(--k,1))}
.pt.key{fill:var(--s-hi)}
.pt.foot{fill:#58a6f0}
.pt.eul{fill:#b07ae8}
.pt.hpt{fill:#e0616a}
.med{stroke:#7fb2ee;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4.5 3.5;opacity:.6}
.pbi{stroke:#2fbf8a;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4.5 3.5;opacity:.55}
.alt2{stroke:#e0616a;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4.5 3.5;opacity:.6}
.eulline{stroke:#b07ae8;stroke-width:calc(1.2 / var(--k,1));stroke-dasharray:4 3;opacity:.55}
.inc{stroke:#2fbf8a;stroke-width:calc(1.8 / var(--k,1))}
.exc{stroke:#2fbf8a;stroke-width:calc(1.4 / var(--k,1));stroke-dasharray:5 4;opacity:.8}
.ext{stroke:var(--s-tri);stroke-width:calc(1.2 / var(--k,1));stroke-dasharray:5 4;opacity:.45}
.ln{stroke:var(--s-tri);stroke-width:calc(2 / var(--k,1))}
.amb{stroke:#e0b061;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4.5 3.5;opacity:.7}
.amb2{stroke:#e0b061;stroke-width:calc(1.3 / var(--k,1));opacity:.8}
.pt.amb{fill:#e0b061}
.pt.mid{fill:#7fb2ee}
.numseg{stroke:#e0b061;stroke-width:calc(2.6 / var(--k,1))}
.denseg{stroke:#7fb2ee;stroke-width:calc(2.6 / var(--k,1))}
.tick{stroke:#e0b061;stroke-width:calc(1.6 / var(--k,1))}
.thinw{stroke:var(--s-tri);stroke-width:calc(1.1 / var(--k,1));opacity:.75}
/* 圆锥曲线是 Pascal / Brianchon 的舞台，不是辅助线，比 .aux 亮一档 */
.conic{stroke:#95a2b0;stroke-width:calc(1.35 / var(--k,1))}
.pt.dimpt{fill:var(--s-aux)}
/* 度量这一族 */
.fillsq{fill-opacity:.13}
.amb2.fillsq{fill:#e0b061}.medp2.fillsq{fill:#7fb2ee}.grnp2.fillsq{fill:#2fbf8a}
.parafill{fill:rgba(47,191,138,.09);stroke:none}
.purp2{stroke:#b07ae8;stroke-width:calc(1.4 / var(--k,1))}
.purp2.fillsq{fill:#b07ae8}
.cycfill{fill:rgba(239,122,58,.10);stroke:none}
.keyd{stroke:var(--s-hi);stroke-width:calc(1.5 / var(--k,1))}
.redp{stroke:#e0616a;stroke-width:calc(1.4 / var(--k,1))}
/* 结论线的底：压在彩色的边上时也分得出是两条线 */
.halo{stroke:var(--ink0);stroke-width:calc(5 / var(--k,1))}
/* 细实线的三色：第二个三角形用，和 O 的灰虚线射线区分开 */
.ambt{stroke:#e0b061;stroke-width:calc(.95 / var(--k,1))}
.medt{stroke:#7fb2ee;stroke-width:calc(.95 / var(--k,1))}
.grnt{stroke:#2fbf8a;stroke-width:calc(.95 / var(--k,1))}
.viot{stroke:#b07ae8;stroke-width:calc(1.4 / var(--k,1))}
.keyc{stroke:var(--s-hi);stroke-width:calc(1.5 / var(--k,1))}
.wingA{fill:rgba(224,176,97,.14);stroke:none}
.wingB{fill:rgba(127,178,238,.14);stroke:none}
.medp{stroke:#7fb2ee;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4 3}
.grnp{stroke:#2fbf8a;stroke-width:calc(1.3 / var(--k,1));stroke-dasharray:4 3}
.medp2{stroke:#7fb2ee;stroke-width:calc(1.3 / var(--k,1))}
.grnp2{stroke:#2fbf8a;stroke-width:calc(1.3 / var(--k,1))}
svg.thumb line,svg.thumb path,svg.thumb circle:not(.pt),svg.thumb ellipse{
  transition:stroke-dashoffset .85s cubic-bezier(.4,0,.2,1);transition-delay:calc(var(--i,0) * 70ms)}
svg.thumb.go line,svg.thumb.go path,svg.thumb.go circle:not(.pt),svg.thumb.go ellipse{stroke-dashoffset:0 !important}
svg.thumb .pt{opacity:0;transform:scale(.2);transform-origin:center;transform-box:fill-box;
  transition:opacity .3s ease,transform .3s cubic-bezier(.34,1.56,.64,1);
  transition-delay:calc(var(--i,0) * 70ms + 420ms)}
svg.thumb.go .pt{opacity:1;transform:scale(1)}
/* 虚线的辅助线：淡入，不做描边动画，免得 dash 被填满成实线 */
svg.thumb .fadein{stroke-opacity:0;transition:stroke-opacity .45s ease;
  transition-delay:calc(var(--i,0) * 70ms)}
svg.thumb.go .fadein{stroke-opacity:1}
/* 悬停循环期间：每帧都是新画的元素，入场过渡必须关掉，否则点永远在淡入 */
svg.thumb.anim *{transition:none !important}
svg.thumb.anim .pt{opacity:1 !important;transform:none !important}
svg.thumb.anim line,svg.thumb.anim path,svg.thumb.anim circle:not(.pt),svg.thumb.anim ellipse{
  stroke-dashoffset:0 !important}   /* 只补全描边，不要动 dasharray：辅助线本来就是虚线 */

#veil{position:fixed;inset:0;background:rgba(10,12,15,.72);
  opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:40}
#veil.on{opacity:1;pointer-events:auto}
#stage{position:fixed;z-index:41;background:var(--ink0);border-radius:10px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5);pointer-events:none;display:none;
  transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),
             width .42s cubic-bezier(.2,.8,.2,1),height .42s cubic-bezier(.2,.8,.2,1),
             border-radius .42s ease}
#stage.on{display:block;pointer-events:auto}
#stage iframe{width:100%;height:100%;border:0;opacity:0;transition:opacity .35s ease .1s}
#stage.loaded iframe{opacity:1}
#stage .bar{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px;color:#cfd6dd;font-size:13px;
  background:linear-gradient(180deg,rgba(15,17,21,.96),rgba(15,17,21,0));z-index:2;pointer-events:none}
#stage .bar b{font-weight:600;color:#fff}
#stage .bar button{pointer-events:auto;border:none;background:rgba(255,255,255,.12);color:#e8eaec;
  border-radius:7px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12px}
#stage .bar button:hover{background:rgba(255,255,255,.22)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,.lede,.chips,.left{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
h1{animation-delay:.04s} .lede{animation-delay:.14s} .chips{animation-delay:.24s}
.left{animation-delay:.3s}
.fam{opacity:0}
.fam.in{animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
.fam.in .card{opacity:0;animation:rise .45s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:calc(var(--n,0) * 40ms + 90ms)}

footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--faint)}
footer a{color:var(--faint)}

@media (max-width:860px){
  .cols{grid-template-columns:1fr;gap:18px}
  .left{position:static;max-width:440px;margin:0 auto}
}
@media (max-width:520px){ .wrap{padding:22px 14px 56px} h1{font-size:22px} .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none !important;transition:none !important}
  h1,.lede,.chips,.left,.fam,.fam .card{opacity:1 !important}
  svg.thumb *{stroke-dashoffset:0 !important;opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>几何图谱</h1>
  <p class="lede">四十多条有名的平面几何定理，按家族排成一张图谱，标出它们之间的推广、特例与对偶关系。
     点图上任意一瓣跳到那一族；点卡片展开看陈述和出处；带图的可以就地放大，拖动顶点自己试。</p>
  <div class="chips" id="chips"><span class="lbl">几何层次</span></div>
</header>

<div class="cols">
  <div class="left">
    <svg id="sun" viewBox="-250 -250 500 500" aria-label="定理图谱：家族与定理"></svg>
    <div class="sunhint" id="sunhint">点一瓣跳到那一族</div>
  </div>
  <main class="right" id="content"></main>
</div>

<footer>
  纯静态页面，不依赖任何外部资源 ·
  代码 MIT，数据 CC BY 4.0 ·
  <a href="about.html">关于</a>
</footer>

</div>

<div id="veil"></div>
<div id="stage">
  <div class="bar"><b id="stageTitle"></b><button id="stageClose">关闭 Esc</button></div>
</div>

<script src="data/atlas.js?v=20261031c"></script>
<script src="js/geometry.js?v=20261031c"></script>
<script src="js/thumbs.js?v=20261031c"></script>
<script src="vendor/d3.min.js?v=20261031c"></script>
<script>
(function () {
  var A = window.ATLAS, byId = {}, famOf = {};
  A.theorems.forEach(function (t) { byId[t.id] = t; });
  A.families.forEach(function (f) { famOf[f.id] = f; });
  // 依赖边的另一端既可能是定理，也可能是基础工具（T1…T8）
  var NAME = {};
  (A.tools || []).forEach(function (x) { NAME[x.id] = x.name; });
  A.theorems.forEach(function (x) { NAME[x.id] = x.name; });
  function nameOf(id) { return NAME[id] || id; }

  var HUE = {
    'nine-point': '#e06c2a', 'projective': '#4a73c4',
    'circle': '#2f8a73', 'concurrent': '#8257c8', 'metric': '#6b7580',
    'inequality': '#c2456b', 'solid': '#2d8fa8'
  };
  // 右栏顺序：好看的放前面，度量这种地基放最后
  var ORDER = ['nine-point', 'concurrent', 'projective', 'circle', 'inequality', 'solid', 'metric'];
  var fams = ORDER.map(function (id) { return famOf[id]; }).filter(Boolean);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var up = {}, down = {}, dual = {};
  A.relations.forEach(function (r) {
    if (r.type === 'dual') {
      (dual[r.from] = dual[r.from] || []).push({ id: r.to, note: r.note });
      (dual[r.to] = dual[r.to] || []).push({ id: r.from, note: r.note });
    } else {
      (down[r.from] = down[r.from] || []).push({ id: r.to, note: r.note });
      (up[r.to] = up[r.to] || []).push({ id: r.from, note: r.note });
    }
  });
  function relLine(list) {
    return list.map(function (x) {
      var t = byId[x.id];
      return '<b>' + esc(t ? t.name : x.id) + '</b>' + (x.note ? '（' + esc(x.note) + '）' : '');
    }).join('、');
  }

  function cardHTML(t, i) {
    var h = '<article class="card" style="--n:' + i + ';--fc:' + HUE[t.family] + '" data-id="' + t.id + '">';
    if (window.THUMBS && THUMBS.has(t.id)) {
      h += '<div class="fig" data-demo="' + esc(t.demo || '') + '" data-name="' + esc(t.name) + '">' +
           THUMBS.svg(t.id) + '</div>';
    }
    h += '<div class="id">' + t.id + '</div><div class="nm">' + esc(t.name) + '</div>'
       + '<div class="one">' + esc(t.statement) + '</div>';
    if (t.demo) h += '<span class="flag">可拖动</span>';
    h += '<div class="more"><dl>';
    if (t.deps && t.deps.length) {
      // 先决条件就是依赖图上的边。定理做成能点的标签（带编号，点了跳过去），
      // 基础工具做成灰标签 —— 两者长得一样的话，根本看不出哪个是定理。
      h += '<dt>先决条件</dt><dd class="deps">' + t.deps.map(function (d) {
        return byId[d]
          ? '<button type="button" class="dep th" data-go="' + d + '">' +
            '<i>' + d + '</i>' + esc(nameOf(d)) + '</button>'
          : '<span class="dep tool">' + esc(nameOf(d)) + '</span>';
      }).join('') + '</dd>';
    }
    if (t.source) h += '<dt>出处</dt><dd>' + esc(t.source) + '</dd>';
    // 关系块暂时不显示：data 里 from 是「更一般的那一条」，卡片上却写成了「推广自」，
    // 方向整个反了（九点二次曲线推广了九点圆，不是九点圆推广自它）。数据保留，
    // 等关系的方向和措辞定清楚再开回来。
    return h + '</dl></div></article>';
  }

  document.getElementById('content').innerHTML = fams.map(function (f) {
    var list = A.theorems.filter(function (t) { return t.family === f.id; });
    return '<section class="fam" id="f-' + f.id + '" data-fam="' + f.id + '">'
      + '<h2><i class="sw" style="background:' + HUE[f.id] + '"></i>' + esc(f.name)
      + '<span class="n">' + list.length + ' 条</span></h2>'
      + '<p class="intro">' + esc(f.intro) + '</p>'
      + '<div class="grid">' + list.map(cardHTML).join('') + '</div></section>';
  }).join('');

  /* 左边：家族 → 定理，两圈 */
  var data = { name: '全部', children: fams.map(function (f) {
    return { name: f.name, fid: f.id, children:
      A.theorems.filter(function (t) { return t.family === f.id; })
        .map(function (t) { return { name: t.name, id: t.id, fid: f.id }; }) };
  }) };
  var root = d3.hierarchy(data).sum(function (d) { return d.id ? 1 : 0; });
  d3.partition().size([2 * Math.PI, root.height + 1])(root);
  var R = 242 / 3;
  var arc = d3.arc().startAngle(function (d) { return d.x0; }).endAngle(function (d) { return d.x1; })
    .padAngle(function (d) { return Math.min((d.x1 - d.x0) / 2, .006); }).padRadius(R * 1.5)
    .innerRadius(function (d) { return d.y0 * R; })
    .outerRadius(function (d) { return Math.max(d.y0 * R, d.y1 * R - 1.2); });

  var svg = d3.select('#sun'), g = svg.append('g'), rot = g.append('g');
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var nodes = root.descendants().slice(1);

  var path = rot.append('g').selectAll('path').data(nodes).join('path')
    .attr('class', 'arc').attr('d', arc)
    .attr('fill', function (d) {
      var base = d3.color(HUE[d.data.fid] || '#888');
      return d.depth === 1 ? base : d3.interpolateRgb(base, css('--bg'))(.45);
    })
    .attr('fill-opacity', function (d) { return d.depth === 1 ? .95 : .82; })
    .attr('stroke', css('--bg')).attr('stroke-width', .8);
  path.append('title').text(function (d) { return d.data.name; });

  var label = rot.append('g').attr('text-anchor', 'middle').attr('pointer-events', 'none')
    .selectAll('text').data(nodes).join('text')
    .attr('dy', '.35em').attr('font-size', function (d) { return d.depth === 1 ? 13.5 : 9.6; })
    .attr('font-weight', function (d) { return d.depth === 1 ? 700 : 500; })
    .attr('fill', function (d) { return d.depth === 1 ? '#fff' : css('--ink'); })
    .attr('fill-opacity', function (d) { return (d.x1 - d.x0) * (d.y1 - d.y0) > .022 ? 1 : 0; })
    .each(function (d) {
      d._a = (d.x0 + d.x1) / 2 * 180 / Math.PI;      // 基准角度
      d._r = (d.y0 + d.y1) / 2 * R;
    })
    .text(function (d) { var n = d.data.name; return n.length > 10 ? n.slice(0, 9) + '…' : n; });

  var cNum = g.append('text').attr('text-anchor', 'middle').attr('dy', '-.05em')
    .attr('font-size', 26).attr('font-weight', 700).attr('fill', css('--ink')).text(A.theorems.length);
  var cSub = g.append('text').attr('text-anchor', 'middle').attr('dy', '1.7em')
    .attr('font-size', 10.5).attr('fill', css('--faint')).text('条定理');
  function centre(a, b) { cNum.text(a); cSub.text(b); }

  path.on('mouseenter', function (e, d) { centre(d.depth === 1 ? d.value : d.data.id, d.data.name); })
    .on('mouseleave', function () { centre(A.theorems.length, '条定理'); })
    .on('click', function (e, d) {
      if (d.depth === 1) {
        document.getElementById('f-' + d.data.fid).scrollIntoView({ block: 'start' });
      } else {
        var c = document.querySelector('.card[data-id="' + d.data.id + '"]');
        if (!c) return;
        c.scrollIntoView({ block: 'center' });
        c.classList.add('open', 'flash');
        setTimeout(function () { c.classList.remove('flash'); }, 1200);
      }
    });

  /* 缓慢自转：十分钟一圈。鼠标放上去就停，方便看字；标签过了水平线自己翻面 */
  var spin = 0, spinning = true, last = 0;
  function placeLabels() {
    label.attr('transform', function (d) {
      // 标签在旋转的组里，角度只用基准值；spin 只用来判断要不要翻面，
      // 否则旋转会叠两次，字就比色块快一倍。
      var abs = ((d._a + spin) % 360 + 360) % 360;
      return 'rotate(' + (d._a - 90) + ') translate(' + d._r + ',0) rotate('
           + (abs < 180 ? 0 : 180) + ')';
    });
  }
  function tick(ts) {
    if (!last) last = ts;
    var dt = ts - last; last = ts;
    if (spinning && !document.hidden) {
      spin += dt * 0.006;                            // 度/毫秒 → 一圈约 10 分钟
      rot.attr('transform', 'rotate(' + spin + ')');
      placeLabels();
    }
    requestAnimationFrame(tick);
  }
  placeLabels();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    svg.on('mouseenter', function () { spinning = false; })
       .on('mouseleave', function () { spinning = true; last = 0; });
    requestAnimationFrame(tick);
  }

  function setActive(fid) {
    path.classed('active', function (d) { return d.depth === 1 && d.data.fid === fid; });
    var f = famOf[fid];
    document.getElementById('sunhint').textContent = f ? f.name : '点一瓣跳到那一族';
  }
  var secs = [].slice.call(document.querySelectorAll('.fam'));
  if (window.IntersectionObserver) {
    var sio = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) setActive(en.target.dataset.fam); });
    }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
    secs.forEach(function (x) { sio.observe(x); });
    var fio = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add('in'); fio.unobserve(en.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: .03 });
    secs.forEach(function (x) { fio.observe(x); });
  } else { secs.forEach(function (x) { x.classList.add('in'); }); }

  /* 几何层次：只做筛选，不参与配色 */
  var activeLayer = null, chips = document.getElementById('chips');
  (A.layers || []).forEach(function (L) {
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = L.name; b.title = L.note; b.dataset.lay = L.id;
    b.onclick = function () {
      activeLayer = (activeLayer === L.id) ? null : L.id;
      chips.querySelectorAll('.chip').forEach(function (x) {
        x.classList.toggle('on', x.dataset.lay === activeLayer);
      });
      var keep = function (id) { return !activeLayer || (byId[id] || {}).layer === activeLayer; };
      document.querySelectorAll('.card').forEach(function (c) {
        c.classList.toggle('faded', !keep(c.dataset.id));
      });
      path.classed('dimmed', function (d) {
        if (!activeLayer) return false;
        return d.depth === 1
          ? !d.children.some(function (k) { return keep(k.data.id); })
          : !keep(d.data.id);
      });
    };
    chips.appendChild(b);
  });

  /* 小图：滚到就画 */
  if (window.THUMBS) {
    var svgs = [].slice.call(document.querySelectorAll('svg.thumb'));
    // 悬停循环在初始化时就全部挂好，不依赖滚动观察器 —— 否则观察器没触发的那几张
    // 永远挂不上，鼠标放上去毫无反应。
    svgs.forEach(function (x) { THUMBS.fit(x); THUMBS.arm(x); THUMBS.live(x); });
    if (window.IntersectionObserver) {
      var tio = new IntersectionObserver(function (es) {
        es.forEach(function (en) {
          if (!en.isIntersecting) return;
          en.target.classList.add('go'); tio.unobserve(en.target);
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: .12 });
      svgs.forEach(function (x) { tio.observe(x); });
    } else { svgs.forEach(function (x) { x.classList.add('go'); }); }
  }

  /* 动图浮层：从那张小图原地长大 */
  var veil = document.getElementById('veil'), stage = document.getElementById('stage'),
      stageTitle = document.getElementById('stageTitle'), origin = null;

  function openStage(fig) {
    var demo = fig.dataset.demo;
    if (!demo || origin) return;
    origin = fig;
    var r = fig.getBoundingClientRect();
    stage.classList.add('on');
    stage.style.left = r.left + 'px'; stage.style.top = r.top + 'px';
    stage.style.width = r.width + 'px'; stage.style.height = r.height + 'px';
    stage.style.borderRadius = '7px';
    stageTitle.textContent = fig.dataset.name;
    void stage.offsetWidth;                       // 先定在原位，再长大
    var pad = Math.min(44, innerWidth * .05);
    var w = Math.min(1040, innerWidth - pad * 2);
    var h = Math.min(innerHeight - pad * 2, Math.round(w * .8));
    stage.style.left = Math.round((innerWidth - w) / 2) + 'px';
    stage.style.top = Math.round((innerHeight - h) / 2) + 'px';
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.borderRadius = '14px';
    veil.classList.add('on');
    document.body.style.overflow = 'hidden';
    setTimeout(function () {
      if (!origin || stage.querySelector('iframe')) return;
      var f = document.createElement('iframe');
      // 带上数据版本号，免得浏览器拿旧副本
      var i = demo.indexOf('#');
      f.src = i < 0 ? demo + '?v=' + A.version
                    : demo.slice(0, i) + '?v=' + A.version + demo.slice(i);
      f.title = fig.dataset.name;
      f.onload = function () { stage.classList.add('loaded'); };
      stage.appendChild(f);
    }, 280);
  }

  function closeStage() {
    if (!origin) return;
    var r = origin.getBoundingClientRect();
    stage.classList.remove('loaded');
    var f = stage.querySelector('iframe'); if (f) f.remove();
    stage.style.left = r.left + 'px'; stage.style.top = r.top + 'px';
    stage.style.width = r.width + 'px'; stage.style.height = r.height + 'px';
    stage.style.borderRadius = '7px';
    veil.classList.remove('on');
    document.body.style.overflow = '';
    origin = null;
    setTimeout(function () { if (!origin) stage.classList.remove('on'); }, 440);
  }

  document.getElementById('stageClose').onclick = closeStage;
  veil.onclick = closeStage;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeStage(); });

  /* 同一行的卡片一起开合。
     卡片在网格里会被拉成等高：单独展开一张，同行的另一张被动变高却没有内容，
     下面就空出一块。一起开合，两边各自显示自己的内容，行高也就对齐了。 */
  function rowMates(card) {
    var grid = card.parentElement;
    if (!grid) return [card];
    var top = card.offsetTop;
    return [].slice.call(grid.children).filter(function (x) {
      return Math.abs(x.offsetTop - top) < 2;
    });
  }
  function setOpen(card, on) {
    var more = card.querySelector('.more');
    card.classList.toggle('open', on);
    if (!more) return;
    clearTimeout(more._t);
    if (on) {
      more.style.height = more.scrollHeight + 'px';
      // 展开完把高度交还给内容，窗口变窄导致文字折行时才不会被截断
      more._t = setTimeout(function () {
        if (card.classList.contains('open')) more.style.height = 'auto';
      }, 340);
    } else {
      more.style.height = more.scrollHeight + 'px';   // 先定住当前高度，才能过渡回 0
      void more.offsetHeight;
      more.style.height = '0px';
    }
  }

  /** 跳到某条定理的卡片，展开并闪一下 */
  function goTo(id) {
    var c = document.querySelector('.card[data-id="' + id + '"]');
    if (!c) return;
    c.scrollIntoView({ block: 'center', behavior: 'smooth' });
    rowMates(c).forEach(function (x) { setOpen(x, true); });
    c.classList.add('flash');
    setTimeout(function () { c.classList.remove('flash'); }, 1200);
  }

  document.addEventListener('click', function (e) {
    var dep = e.target.closest('.dep.th');
    if (dep) { e.stopPropagation(); goTo(dep.dataset.go); return; }
    var fig = e.target.closest('.fig');
    if (fig) { openStage(fig); return; }
    var c = e.target.closest('.card');
    if (!c) return;
    var on = !c.classList.contains('open');
    rowMates(c).forEach(function (x) { setOpen(x, on); });
  });
})();
</script>
</body>
</html>
